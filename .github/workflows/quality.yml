name: Calidad demo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: calidad-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: compilacion-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
  test:
    name: Test y cobertura
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: datos-pruebas-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
  analyze:
    name: Analyze estatico y duplicacion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run analyze
      - run: npm run lint
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: datos-analisis-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
  report:
    name: Report y dashboard
    if: ${{ always() }}
    needs: [build, test, analyze]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: datos-*
          path: artifacts/
          merge-multiple: true
      - run: npm run report
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: informes-sqa-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
  container:
    name: Contenedor Docker
    needs: [build, test, analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: docker compose -p sqa-entrega up -d --build
      - run: node quality/docker-smoke.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: evidencia-docker-${{ github.sha }}
          path: artifacts/docker-smoke.json
          retention-days: 30
          if-no-files-found: error
      - run: docker compose -p sqa-entrega logs --no-color
        if: always()
      - run: docker compose -p sqa-entrega down
        if: always()
  delivery:
    name: Entrega verificada
    needs: [build, test, analyze, report, container]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compilacion-${{ github.sha }}
          path: release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: entrega-aprobada-${{ github.sha }}
          path: release/
          retention-days: 30
  acceptance:
    name: Aceptacion de calidad
    if: ${{ always() }}
    needs: [build, test, analyze, report, container, delivery]
    runs-on: ubuntu-24.04
    steps:
      - name: Exigir todas las etapas aprobadas
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e "const r=JSON.parse(process.env.RESULTS);for(const k of ['build','test','analyze','report','container','delivery'])if(r[k]?.result!=='success')process.exit(1)"
