<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demostración SQA · Reparto de costos</title><link rel="stylesheet" href="/style.css"><main><p class="tag">DEMOSTRACIÓN ACADÉMICA</p><h1>Reparto exacto de costos</h1><p>Dos productos ficticios y un gasto de transporte. Los importes se calculan con centavos enteros.</p><form id="form"><label>Precio del producto A (GTQ)<input name="a" type="number" min="0.01" max="1000000" step="0.01" value="100.00" required></label><label>Precio del producto B (GTQ)<input name="b" type="number" min="0.01" max="1000000" step="0.01" value="200.00" required></label><label>Transporte total (GTQ)<input name="gasto" type="number" min="0" max="1000000" step="0.01" value="30.00" required></label><button>Calcular</button></form><section aria-live="polite"><h2>Resultado</h2><pre id="result">Completa los importes y pulsa Calcular.</pre></section><footer>Sin conexión a bases de datos, cuentas ni servicios de ninguna empresa. No guardes información real.</footer></main><script src="/app.js"></script></html>
